name: "Set up Godot"
description: Install pinned engine and templates through released shared setup
inputs:
  install-templates:
    description: Whether to install export templates
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: "Set up Godot"
    uses: nicodes/tools/godot-setup@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
    with:
      version: 4.7.2
      origin: godot
      binary-checksum: sha256:cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      templates-checksum: sha256:f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      install-templates: ${{ inputs.install-templates }}
      expected-version: 4.7.2.stable.official.ed1daf0bf
  - name: Verify required web template
    if: inputs.install-templates == 'true'
    shell: bash
    run: test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_release.zip"
